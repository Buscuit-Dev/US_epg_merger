name: Daily EPG Update

on:
  schedule:
    # Runs automatically every day at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows you to manually trigger it from GitHub anytime

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permissions to commit back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EPG Merger
        run: python merger.py

      - name: Commit and push updated master_epg.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_epg.xml
          git commit -m "Automated daily EPG update" || exit 0
          git push
